<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cubilete DP Calculator</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f5f5;font-family:Arial,system-ui,sans-serif;color:#233b3b;padding:16px}.widget{width:min(100%,440px);background:white;border:1px solid #dce4e3;border-radius:16px;box-shadow:0 10px 30px #17393814;overflow:hidden}.top{padding:15px 19px;background:#244446;color:#fff;display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;letter-spacing:.2px;margin:0}.tag{font-size:10px;background:#3b6162;color:#e6f1ee;border-radius:6px;padding:4px 7px}.body{padding:19px}.lbl{font-size:12px;font-weight:700;color:#697d7b;margin-bottom:7px}.dice-inputs{display:flex;gap:8px}.dice-inputs select{width:calc((100% - 32px)/5);height:42px;border:1px solid #cddcda;background:#fff;border-radius:8px;text-align:center;font-size:19px;color:#254144;font-weight:700}.buttons{display:flex;gap:8px;margin-top:12px}button{cursor:pointer;border:0;border-radius:8px;font-size:13px;font-weight:700;padding:11px 12px;background:#1a695f;color:#fff;flex:1}button.alt{background:#edf3f2;color:#385d5a}button:hover{filter:brightness(.96)}.result{margin-top:18px;border-top:1px solid #e6eceb;padding-top:15px}.result-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.step{font-size:12px;font-weight:700;color:#56716b}.pill{font-size:10px;border-radius:30px;color:#276658;background:#e6f4ed;padding:4px 8px}.dice{display:flex;gap:7px;margin:12px 0}.die{height:43px;flex:1;display:grid;place-items:center;border-radius:9px;font-size:20px;font-weight:700;background:#f5f7f7;border:1px solid #ccd9d8}.die.keep{background:#e2f2e9;border-color:#75b59c;color:#1b644b}.die.reroll{background:#fff2ed;border-color:#e3ac9e;color:#974b37}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{background:#f6f8f7;padding:9px 10px;border-radius:9px;min-width:0}.field .name{font-size:11px;color:#657b78}.field .val{font-weight:700;font-size:14px;margin-top:3px;word-break:break-word}.score{background:#e9f4f0;border-radius:9px;margin-top:10px;padding:10px 13px;display:flex;align-items:center;justify-content:space-between}.score span{font-size:12px;color:#53746a}.score strong{font-size:22px;color:#166b55}.next{margin-top:13px}.hint{font-size:11px;color:#71817e;line-height:1.5;margin-top:8px}.final{color:#1b624d;font-weight:700}.legend{display:flex;gap:14px;font-size:11px;color:#5d716e;margin:-4px 0 4px}.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}.legend .k{background:#e2f2e9;border:1px solid #75b59c}.legend .r{background:#fff2ed;border:1px solid #e3ac9e}.hidden{display:none}.foot{font-size:11px;text-align:center;color:#81918e;margin-top:12px}@media(max-width:460px){.body{padding:14px}.top{padding:13px 15px}}
</style></head><body><div><main class="widget"><header class="top"><h1>Cubilete · DP Calculator</h1><span class="tag">5 dice</span></header><div class="body"><div class="lbl">Initial roll</div><div class="dice-inputs" id="startDice"></div><section class="result" id="result"></section></div></main><div class="foot">Exact DP · Retained dice stay locked</div></div><script>

const N=5, memo=new Map(), optionsMemo=new Map(), outcomeMemo=new Map();const $=id=>document.getElementById(id);let active1=null,active2=null;
function sort(a){return [...a].sort((a,b)=>a-b)}function key(a){return a.join(',')}function count(a,f){return a.filter(x=>x===f).length}function score(a){a=sort(a);if(a.every(v=>v===1))return 10;let non=a.filter(v=>v!==1),faces=new Set(non);if(faces.size!==1)return 0;if(non[0]===6)return a.includes(1)?2:5;return 1}
function keeps(s,locked){let k=key(s)+'|'+key(locked);if(optionsMemo.has(k))return optionsMemo.get(k);let all=[];const rec=(i,arr)=>{if(i===7){
 if([1,2,3,4,5,6].every(f=>count(arr,f)>=count(locked,f)))all.push(arr.slice());return}
 let f=i,c=count(s,f);for(let v=0;v<=c;v++){for(let j=0;j<v;j++)arr.push(f);rec(i+1,arr);arr.length-=v}};rec(1,[]);all.sort((a,b)=>a.length-b.length||key(a).localeCompare(key(b)));optionsMemo.set(k,all);return all}
function fact(n){let p=1;for(let i=2;i<=n;i++)p*=i;return p}
function outcomes(n){if(outcomeMemo.has(n))return outcomeMemo.get(n);let r=[],rec=(v,left,a)=>{if(v===7){if(left===0){let denominator=1;for(let f=1;f<=6;f++)denominator*=fact(count(a,f));r.push([a.slice(),fact(n)/denominator/(6**n)])}return}for(let i=0;i<=left;i++){for(let j=0;j<i;j++)a.push(v);rec(v+1,left-i,a);a.length-=i}};rec(1,n,[]);outcomeMemo.set(n,r);return r}
function find(s,l,r){s=sort(s);l=sort(l);let k=[key(s),key(l),r].join('|');if(memo.has(k))return memo.get(k);if(r===0)return {v:score(s),keep:s};let best=-1,chosen=[];for(let keep of keeps(s,l)){let val=0;for(let [o,p] of outcomes(N-keep.length))val+=p*find(sort([...keep,...o]),keep,r-1).v;if(val>best+1e-12||(Math.abs(val-best)<=1e-12&&keep.length>chosen.length)){best=val;chosen=keep}}let res={v:best,keep:chosen};memo.set(k,res);return res}
function rerolled(s,k){let left=s.slice();for(let v of k){let i=left.indexOf(v);if(i>=0)left.splice(i,1)}return left}

let stage=1;let state=[],locked=[],kept=[],rolls=2;
function readStart(){return sort([...document.querySelectorAll('.initial')].map(e=>Number(e.value)))}
function dieHtml(s,keep){let pool=keep.slice();return '<div class="dice">'+s.map(v=>{let ix=pool.indexOf(v),k=ix>=0;if(k)pool.splice(ix,1);return `<span class="die ${k?'keep':'reroll'}">${v}</span>`}).join('')+'</div>'}

function render(){const el=$('result');if(rolls===0){el.innerHTML=`<div class="result-head"><span class="step">Roll 3 · Final hand</span><span class="pill">Finished</span></div>${dieHtml(state,state)}<div class="score"><span>Final score</span><strong>${score(state)} points</strong></div><div class="buttons"><button class="alt" id="again">New turn</button></div>`;$('again').onclick=init;return}
let result=find(state,locked,rolls);kept=result.keep.slice();let rr=rerolled(state,kept);el.innerHTML=`<div class="result-head"><span class="step">Roll ${stage} · Optimal action</span><span class="pill">${rolls} re-roll${rolls===1?'':'s'} left</span></div>${dieHtml(state,kept)}<div class="legend"><span><i class="k"></i>Green: keep</span><span><i class="r"></i>Red: re-roll</span></div><div class="score"><span>Expected final score</span><strong>${result.v.toFixed(4)}</strong></div>${rr.length?`<div class="next"><div class="buttons"><button id="random">Next roll</button></div></div>`:`<p class="hint final">Optimal decision: stop and keep all dice.</p><div class="buttons"><button class="alt" id="again">New turn</button></div>`}`;
if(rr.length){$('random').onclick=next}else $('again').onclick=init;}
function next(){let result=Array.from({length:N-kept.length},()=>Math.floor(Math.random()*6)+1);state=sort([...kept,...result]);locked=kept.slice();rolls--;stage++;render()}
function calculate(){state=readStart();locked=[];rolls=2;stage=1;render()}
function init(){[1,1,2,6,6].forEach((v,i)=>{});$('startDice').innerHTML=[1,1,2,6,6].map(v=>`<select class="initial">${Array.from({length:6},(_,j)=>`<option value="${j+1}" ${j+1===v?'selected':''}>${j+1}</option>`).join('')}</select>`).join('');document.querySelectorAll('.initial').forEach(el=>el.addEventListener('change',calculate));calculate()}
init();
</script></body></html>
